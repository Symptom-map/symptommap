<!-- Supabase Auth "Reset Password" template.
     Paste in: Supabase dashboard → Authentication → Emails → Reset Password.
     Subject: SymptomMap Reset Password (so it is not confused with the sign-up code email)
     The app asks for a code, not a link ("Forgot your password?").
     No health data and no name: only the code. -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#1A1A1A;background:#FAF7F0">
  <p style="font-size:20px;font-weight:bold;margin:0 0 16px">Your SymptomMap code</p>
  <p style="font-size:15px;line-height:1.5;margin:0 0 24px">Enter this code in SymptomMap to choose a new password. It works once and expires in an hour.</p>
  <p style="font-size:32px;font-weight:bold;letter-spacing:8px;margin:0 0 24px;padding:16px;background:#FFFFFF;border-radius:12px;text-align:center">{{ .Token }}</p>
  <p style="font-size:13px;line-height:1.5;color:#57534E;margin:0">If you didn’t ask to reset your password, you can ignore this email. Your password won’t change.</p>
</div>
