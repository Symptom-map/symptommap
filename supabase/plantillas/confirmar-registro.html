<!-- Supabase Auth "Confirm signup" template.
     Paste in: Supabase dashboard → Authentication → Emails → Confirm signup.
     Subject: Your SymptomMap code
     Layout like a plain transactional email (Ana's reference, 25 Oct 2026):
     logo, title, one line, the code in a grey box, a short note, sign-off.
     The logo is served from the public site (assets/email-logo.png, also
     published while the site shows "Coming soon").
     No health data and no name: only the code. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F6F4EF;padding:32px 12px">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#FFFFFF;border-radius:16px">
        <tr>
          <td align="center" style="padding:36px 32px 24px">
            <img src="https://www.symptommap.com.au/assets/email-logo.png" width="140" height="109" alt="SymptomMap" style="display:block;border:0;width:140px;height:auto">
          </td>
        </tr>
        <tr><td style="padding:0 32px"><div style="border-top:1px solid #ECE8E1;line-height:0">&nbsp;</div></td></tr>
        <tr>
          <td style="padding:28px 32px 0;font-family:Arial,Helvetica,sans-serif;color:#1A1A1A">
            <p style="margin:0 0 18px;font-size:22px;line-height:1.3;font-weight:bold">Confirm your email</p>
            <p style="margin:0 0 20px;font-size:15px;line-height:1.6">Enter this code in SymptomMap to confirm your email and finish creating your account.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px">
            <div style="background:#F3F1EC;border-radius:12px;padding:18px;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:bold;letter-spacing:8px;color:#1A1A1A">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#57534E">
            <p style="margin:0 0 24px">If you didn’t try to create a SymptomMap account, you can ignore this email.</p>
            <p style="margin:0 0 32px;color:#1A1A1A">Take care,<br>The SymptomMap team</p>
          </td>
        </tr>
        <tr><td style="padding:0 32px 28px"><div style="border-top:1px solid #ECE8E1;line-height:0">&nbsp;</div></td></tr>
      </table>
    </td>
  </tr>
</table>
