<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

     esta página como / y como 404 en producción (ver v2/scripts/construir-sitio.mjs).
     La app real se prueba en las vistas previas protegidas de Vercel. -->
<title>SymptomMap — Coming soon</title>
<meta name="description" content="A self-understanding tool for adults living with more than one diagnosed mental health condition. Not a diagnosis tool. Coming soon.">

<meta name="twitter:title" content="SymptomMap — Coming soon">

<style>
  @font-face { font-family: "Outfit"; font-weight: 700; font-display: swap;
    src: url("/assets/fonts/outfit-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 400; font-display: swap;
    src: url("/assets/fonts/plus-jakarta-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 600; font-display: swap;
    src: url("/assets/fonts/plus-jakarta-sans-latin-600-normal.woff2") format("woff2"); }

  :root {
    --cream: #FAF7F0; --ink: #1A1A1A; --body: #57534E;
    --cyan-400: #48CAE4; --cyan-500: #00B4D8;
    --gradient: linear-gradient(96deg, #48CAE4, #9D50BB);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; background: var(--cream); color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 24px 32px; }
  .logo {
    display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink);
    font-family: "Outfit", system-ui, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -.025em;
  }
  .logo .map { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 24px 96px;
  }
  main img { width: 120px; height: 120px; }
  h1 {
    font-family: "Outfit", system-ui, sans-serif; font-weight: 700;
    font-size: 40px; line-height: 46px; letter-spacing: -.02em; margin: 32px 0 0;
  }
  p { font-size: 16.5px; line-height: 27px; color: var(--body); max-width: 440px; margin: 16px 0 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 46px; padding: 0 24px; margin-top: 32px; border-radius: 16px;
    background: var(--cyan-400); color: var(--ink); /* charcoal on cyan: never white */
    font-weight: 600; font-size: 15px; text-decoration: none;
    transition: background-color .16s ease, box-shadow .16s ease;
  }
  .btn:hover { background: var(--cyan-500); box-shadow: 0 6px 16px -8px rgba(26,26,26,.35); }
  .btn:focus-visible { outline: none; background: var(--cyan-500); box-shadow: inset 0 0 0 1.5px rgba(26,26,26,.55); }
  @media (max-width: 480px) { h1 { font-size: 30px; line-height: 36px; } }
</style>
<style>
  .logo-grande { width: min(340px, 78vw); height: auto; }
  main { padding-top: 72px; }
  main h1 { margin-top: 40px; }
  footer { padding: 24px 32px 32px; text-align: center; font-size: 13.5px; line-height: 22px; color: var(--body); }
</style>
</head>
<body>

  <main>
    <picture>
      <source srcset="/assets/logo-symptommap.webp" type="image/webp">
      <img class="logo-grande" src="/assets/logo-symptommap.png" width="720" height="561" alt="SymptomMap">
    </picture>
    <h1 id="t">Coming soon</h1>
    <p id="d">SymptomMap is a visual self-understanding tool for adults living with more than one diagnosed mental health condition. We’re building it now.</p>
  </main>

  <footer id="f">Independent project · Funded by the Victoria University SSAF Grant</footer>

  <script>
    // Si el navegador está en español, mostrar el texto en español neutro.
    if ((navigator.language || '').toLowerCase().startsWith('es')) {
      document.documentElement.lang = 'es';
      document.title = 'SymptomMap — Muy pronto';
      document.getElementById('t').textContent = 'Muy pronto';
      document.getElementById('d').textContent = 'SymptomMap es una herramienta visual de autocomprensión para personas adultas que viven con más de un diagnóstico de salud mental. La estamos construyendo.';
      document.getElementById('f').textContent = 'Proyecto independiente · Financiado por el SSAF Grant de Victoria University';
    }
  </script>
</body>
</html>
